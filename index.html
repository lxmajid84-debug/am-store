<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASM Store</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#171717}
header{background:#111;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:5}
.top{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-size:24px;font-weight:800}.tag{font-size:12px;color:#bbb}
.hero{max-width:900px;margin:18px auto;padding:28px 18px;border-radius:18px;background:#fff;text-align:center}
.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;color:#666}
.search{max-width:900px;margin:0 auto 16px;padding:0 16px}.search input{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;font-size:16px}
.products{max-width:900px;margin:auto;padding:0 16px 30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 10px #0000000d}.pic{width:100%;height:180px;object-fit:cover;background:#eee}
.info{padding:13px}.info h3{margin:0 0 6px}.price{font-size:19px;font-weight:700;margin-bottom:10px}
button{border:0;border-radius:10px;padding:11px 14px;background:#111;color:#fff;font-weight:700;cursor:pointer;width:100%}
.empty{text-align:center;grid-column:1/-1;padding:30px;color:#777}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;padding:20px;align-items:center;justify-content:center}
.box{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%}.box h2{margin-top:0}
.box input,.box textarea{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
.close{background:#ddd;color:#111;margin-top:8px}
footer{text-align:center;padding:25px;color:#777;font-size:13px}
</style>
</head>
<body>
<header><div class="top"><div><div class="logo">ASM Store</div><div class="tag">Quality products • Easy ordering</div></div><div>🛍️</div></div></header>

<section class="hero">
<h1>Welcome to ASM Store</h1>
<p>Find your favorite products and order easily on WhatsApp.</p>
</section>

<div class="search"><input id="search" placeholder="Search products..." oninput="render()"></div>
<section id="products" class="products"></section>

<div id="modal" class="modal">
<div class="box">
<h2>Place Order</h2>
<p id="selected"></p>
<input id="name" placeholder="Your name">
<input id="phone" placeholder="Your phone number">
<textarea id="address" rows="3" placeholder="Delivery address"></textarea>
<button onclick="sendOrder()">Order on WhatsApp</button>
<button class="close" onclick="closeModal()">Close</button>
</div>
</div>

<footer>© 2026 ASM Store</footer>

<script src="script.js"></script>
<script>
const WHATSAPP = "923157581234";
let products = [];
let current = null;

async function loadProducts() {
  products = await getProducts();
  render();
}

function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const list = products.filter(p => p.name.toLowerCase().includes(q));
  const el = document.getElementById("products");
  el.innerHTML = list.length ? list.map((p) => `
  <article class="card">
  <img class="pic" src="${p.image_url || 'https://via.placeholder.com/600x500?text=No+Image'}" alt="${p.name}">
  <div class="info"><h3>${p.name}</h3><div class="price">Rs. ${p.price}</div>
  <button onclick="openOrder(${p.id})">Order Now</button></div></article>`).join("") : '<div class="empty">No products found.</div>';
}

function openOrder(id) {
  current = products.find(p => p.id === id);
  document.getElementById("selected").textContent = current.name + " — Rs. " + current.price;
  document.getElementById("modal").style.display = "flex";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function sendOrder() {
  const n = document.getElementById("name").value.trim();
  const ph = document.getElementById("phone").value.trim();
  const a = document.getElementById("address").value.trim();
  if (!n || !ph || !a) {
    alert("Please fill all fields.");
    return;
  }
  const msg = `ASM Store Order%0A%0AProduct: ${current.name}%0APrice: Rs. ${current.price}%0AName: ${n}%0APhone: ${ph}%0AAddress: ${a}`;
  window.open("https://wa.me/" + WHATSAPP + "?text=" + msg, "_blank");
}

loadProducts();
</script>
</body>
</html>
