<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#f85606">
<meta name="description" content="AM Store - Online Shopping">
<title>AM Store</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --orange:#f85606;
 --orange2:#ff8a00;
 --blue:#2874f0;
 --green:#16a34a;
 --text:#202020;
 --muted:#707070;
 --bg:#f4f5f7;
 --card:#fff;
 --line:#e7e7e7;
}

*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:var(--bg);
 color:var(--text);
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

/* HEADER */
.top{
 background:linear-gradient(180deg,#f85606 0,#ff6b0a 58px,#fff 58px);
 position:sticky;
 top:0;
 z-index:20;
 box-shadow:0 2px 10px #0002;
}

.header{
 max-width:1200px;
 margin:auto;
 padding:10px 14px;
 display:flex;
 align-items:center;
 gap:12px;
}

.logo{
 font-size:25px;
 font-weight:900;
 color:#fff;
 white-space:nowrap;
}

.search{
 height:46px;
 display:flex;
 flex:1;
 border:0;
 border-radius:6px;
 overflow:hidden;
 background:#fff;
 box-shadow:0 2px 7px #0002;
}

.search input{
 border:0;
 outline:0;
 flex:1;
 padding:0 16px;
 font-size:16px;
}

.search button{
 width:58px;
 border:0;
 background:#ffe1d1;
 color:#f85606;
 font-size:24px;
}

.adminBtn{
 border:0;
 background:#fff;
 color:#f85606;
 border-radius:5px;
 padding:10px 14px;
 font-weight:800;
}

/* CATEGORIES */
.categories{
 display:flex;
 gap:26px;
 overflow:auto;
 padding:12px 14px;
 border-top:1px solid #eee;
 background:#fff;
 scrollbar-width:none;
}

.categories::-webkit-scrollbar{display:none}

.cat{
 white-space:nowrap;
 border:0;
 background:none;
 color:#555;
 font-weight:700;
 font-size:15px;
}

.cat.active{
 color:#f85606;
 border-bottom:3px solid #f85606;
 padding-bottom:7px;
}

/* HERO */
.hero{
 max-width:1200px;
 margin:12px auto;
 background:linear-gradient(100deg,#fff0e8,#fff6df 45%,#eef5ff);
 padding:26px 20px;
 border-radius:8px;
 box-shadow:0 2px 10px #0001;
}

.hero h1{
 margin:0 0 7px;
 font-size:30px;
 color:#f04d00;
}

.hero p{
 margin:0;
 color:#666;
}

/* DEALS */
.sectionStrip{
 max-width:1200px;
 margin:12px auto 8px;
 background:#fff;
 padding:13px 14px;
 border-radius:4px;
 font-weight:900;
 border-left:4px solid #f85606;
}

/* TOOLBAR */
.toolbar{
 max-width:1200px;
 margin:10px auto;
 padding:0 12px;
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.toolbar h2{
 margin:0;
 font-size:21px;
}

.toolbar select{
 padding:8px;
 border:1px solid #ddd;
 border-radius:8px;
 background:#fff;
}

/* PRODUCTS */
.grid{
 max-width:1200px;
 margin:auto;
 padding:0 10px 85px;
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px;
}

.card{
 background:#fff;
 border-radius:5px;
 overflow:hidden;
 box-shadow:0 1px 5px #0002;
 border:1px solid #eee;
}

.pic{
 width:100%;
 aspect-ratio:1/1;
 object-fit:cover;
 display:block;
 background:#eee;
}

.info{
 padding:9px;
}

.name{
 font-size:15px;
 line-height:1.3;
 min-height:39px;
}

.price{
 font-size:20px;
 font-weight:900;
 margin-top:6px;
 color:#f85606;
}

.meta{
 font-size:12px;
 color:#777;
 margin-top:4px;
}

.stock{
 color:#159431;
}

.buy{
 width:100%;
 margin-top:8px;
 border:0;
 border-radius:4px;
 background:#f85606;
 color:#fff;
 padding:10px;
 font-weight:800;
}

/* EMPTY */
.empty{
 grid-column:1/-1;
 text-align:center;
 background:#fff;
 padding:45px 15px;
 border-radius:10px;
 color:#777;
}

/* BOTTOM NAV */
.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:#fff;
 border-top:1px solid #ddd;
 z-index:25;
 display:none;
 justify-content:space-around;
 padding:7px 4px;
 font-size:12px;
 font-weight:700;
 box-shadow:0 -2px 8px #0001;
}

.bottom button{
 border:0;
 background:none;
}

/* MODALS */
.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 z-index:50;
 padding:15px;
 overflow:auto;
}

.modal.show{
 display:flex;
 align-items:center;
 justify-content:center;
}

.box{
 background:#fff;
 width:min(620px,100%);
 border-radius:14px;
 padding:18px;
 position:relative;
 max-height:92vh;
 overflow:auto;
}

.close{
 position:absolute;
 right:12px;
 top:8px;
 border:0;
 background:none;
 font-size:28px;
}

.form{
 display:grid;
 gap:10px;
}

.form input,
.form textarea,
.form select{
 width:100%;
 padding:11px;
 border:1px solid #ccc;
 border-radius:8px;
 outline:0;
}

.form textarea{
 min-height:90px;
 resize:vertical;
}

.primary{
 border:0;
 background:#f85606;
 color:#fff;
 border-radius:7px;
 padding:12px;
 font-weight:800;
}

.secondary{
 border:1px solid #ccc;
 background:#fff;
 border-radius:7px;
 padding:10px;
}

.danger{
 border:0;
 background:#d93025;
 color:#fff;
 border-radius:7px;
 padding:10px;
 font
