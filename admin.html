<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - ASM Store</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f6f8;color:#171717}
header{background:#111;color:#fff;padding:18px 16px}
.top{max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:24px;font-weight:800}
.container{max-width:900px;margin:20px auto;padding:0 16px}
.card{background:#fff;border-radius:15px;padding:20px;margin-bottom:20px;box-shadow:0 2px 10px #0000000d}
h2{margin-top:0}
input,textarea,select{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:10px;font-size:15px}
button{border:0;border-radius:10px;padding:12px 16px;background:#111;color:#fff;font-weight:700;cursor:pointer;width:100%;margin-top:5px}
button.danger{background:#dc2626}
.product-item{display:flex;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}
.product-item img{width:60px;height:60px;object-fit:cover;border-radius:8px}
.product-item-info{flex:1}
.product-item-info h4{margin:0 0 4px}
.product-item-info p{margin:0;color:#666;font-size:14px}
</style>
</head>
<body>
<header><div class="top"><div class="logo">ASM Store - Admin</div><a href="index.html" style="color:#fff">View Store</a></div></header>

<div class="container">
  <!-- Add Product Form -->
  <div class="card">
    <h2>Add New Product</h2>
    <input id="p-name" placeholder="Product Name">
    <input id="p-price" type="number" placeholder="Price (e.g. 1500)">
    <textarea id="p-desc" rows="2" placeholder="Description"></textarea>
    <input id="p-category" placeholder="Category (e.g. Electronics)">
    <input id="p-stock" type="number" placeholder="Stock Quantity">
    <input id="p-image" type="file" accept="image/*">
    <button onclick="handleAddProduct()">Add Product</button>
  </div>

  <!-- Product List -->
  <div class="card">
    <h2>Existing Products</h2>
    <div id="admin-products">Loading...</div>
  </div>
</div>

<script src="script.js"></script>
<script>
async function loadAdminProducts() {
  const products = await getProducts();
  const el = document.getElementById('admin-products');
  if (products.length === 0) {
    el.innerHTML = '<p>No products yet.</p>';
    return;
  }
  el.innerHTML = products.map(p => `
    <div class="product-item">
      <img src="${p.image_url || 'https://via.placeholder.com/60'}" alt="${p.name}">
      <div class="product-item-info">
        <h4>${p.name}</h4>
        <p>Rs. ${p.price} | Stock: ${p.stock || 0}</p>
      </div>
      <button class="danger" style="width:auto;padding:8px 12px" onclick="handleDelete(${p.id})">Delete</button>
    </div>
  `).join('');
}

async function handleAddProduct() {
  const name = document.getElementById('p-name').value.trim();
  const price = document.getElementById('p-price').value.trim();
  const desc = document.getElementById('p-desc').value.trim();
  const category = document.getElementById('p-category').value.trim();
  const stock = document.getElementById('p-stock').value.trim();
  const fileInput = document.getElementById('p-image');
  
  if (!name || !price) {
    alert('Name and Price are required!');
    return;
  }
  
  let imageUrl = '';
  if (fileInput.files.length > 0) {
    imageUrl = await uploadImage(fileInput.files[0]);
    if (!imageUrl) {
      alert('Image upload failed!');
      return;
    }
  }
  
  const success = await addProduct({
    name: name,
    price: parseFloat(price),
    description: desc,
    category: category,
    stock: parseInt(stock) || 0,
    image_url: imageUrl
  });
  
  if (success) {
    alert('Product added successfully!');
    document.getElementById('p-name').value = '';
    document.getElementById('p-price').value = '';
    document.getElementById('p-desc').value = '';
    document.getElementById('p-category').value = '';
    document.getElementById('p-stock').value = '';
    document.getElementById('p-image').value = '';
    loadAdminProducts();
  } else {
    alert('Failed to add product.');
  }
}

async function handleDelete(id) {
  if (confirm('Are you sure you want to delete this product?')) {
    const success = await deleteProduct(id);
    if (success) {
      alert('Product deleted!');
      loadAdminProducts();
    } else {
      alert('Failed to delete product.');
    }
  }
}

loadAdminProducts();
</script>
</body>
</html>
